<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e89d"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <circle cx="650" cy="80" r="120" fill="#00e89d" opacity="0.04"/>
  <circle cx="700" cy="350" r="80" fill="#6366f1" opacity="0.05"/>
  <circle cx="100" cy="300" r="60" fill="#00e89d" opacity="0.03"/>

  <!-- Decorative lines -->
  <line x1="0" y1="0" x2="800" y2="400" stroke="#00e89d" stroke-width="0.5" opacity="0.08"/>
  <line x1="800" y1="0" x2="0" y2="400" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>

  <!-- Card stack - left side -->
  <!-- Back card -->
  <g transform="translate(140, 120) rotate(-8)" filter="url(#shadow1)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#1e2235" stroke="#2d3352" stroke-width="1"/>
    <rect x="15" y="15" width="60" height="8" rx="2" fill="#2d3352"/>
    <rect x="15" y="30" width="100" height="6" rx="2" fill="#2d3352" opacity="0.5"/>
    <rect x="15" y="42" width="80" height="6" rx="2" fill="#2d3352" opacity="0.3"/>
    <circle cx="170" cy="90" r="12" fill="#00e89d" opacity="0.2"/>
  </g>

  <!-- Middle card -->
  <g transform="translate(120, 100) rotate(-3)" filter="url(#shadow1)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#1a1f2e" stroke="#00e89d" stroke-width="0.5" opacity="0.8"/>
    <rect x="15" y="15" width="70" height="8" rx="2" fill="#00e89d" opacity="0.4"/>
    <rect x="15" y="30" width="110" height="6" rx="2" fill="#a3adc0" opacity="0.4"/>
    <rect x="15" y="42" width="90" height="6" rx="2" fill="#a3adc0" opacity="0.3"/>
    <rect x="15" y="60" width="170" height="1" fill="#2d3352"/>
    <text x="15" y="80" font-family="Arial, sans-serif" font-size="7" fill="#8892a8">VITTO GD</text>
    <text x="15" y="92" font-family="Arial, sans-serif" font-size="5" fill="#6366f1">Gráfica Digital</text>
  </g>

  <!-- Front card (main) -->
  <g transform="translate(100, 80) rotate(2)" filter="url(#glow1)">
    <rect x="0" y="0" width="220" height="132" rx="10" fill="url(#card1)" stroke="url(#accent)" stroke-width="1.5"/>
    <!-- Card content -->
    <rect x="18" y="18" width="80" height="10" rx="3" fill="url(#accent)"/>
    <rect x="18" y="36" width="140" height="7" rx="2" fill="#a3adc0" opacity="0.6"/>
    <rect x="18" y="50" width="120" height="7" rx="2" fill="#a3adc0" opacity="0.4"/>
    <rect x="18" y="64" width="100" height="7" rx="2" fill="#a3adc0" opacity="0.3"/>
    <rect x="18" y="84" width="184" height="1" fill="#2d3352"/>
    <!-- QR Code style -->
    <rect x="160" y="92" width="30" height="30" rx="3" fill="#00e89d" opacity="0.15"/>
    <rect x="165" y="97" width="8" height="8" rx="1" fill="#00e89d" opacity="0.4"/>
    <rect x="177" y="97" width="8" height="8" rx="1" fill="#6366f1" opacity="0.4"/>
    <rect x="165" y="109" width="8" height="8" rx="1" fill="#6366f1" opacity="0.4"/>
    <rect x="177" y="109" width="8" height="8" rx="1" fill="#00e89d" opacity="0.4"/>
    <text x="18" y="100" font-family="Arial, sans-serif" font-size="6" fill="#8892a8">Couchê 250g</text>
    <text x="18" y="112" font-family="Arial, sans-serif" font-size="6" fill="#00e89d">3 dias úteis</text>
    <text x="18" y="124" font-family="Arial, sans-serif" font-size="5" fill="#6366f1">Acabamentos profissionais</text>
  </g>

  <!-- Scattered mini cards -->
  <g transform="translate(380, 280) rotate(12)" opacity="0.5">
    <rect x="0" y="0" width="60" height="36" rx="4" fill="#1e2235" stroke="#2d3352" stroke-width="0.5"/>
    <rect x="6" y="6" width="24" height="3" rx="1" fill="#00e89d" opacity="0.5"/>
    <rect x="6" y="12" width="36" height="2" rx="1" fill="#2d3352"/>
    <rect x="6" y="17" width="30" height="2" rx="1" fill="#2d3352" opacity="0.5"/>
  </g>
  <g transform="translate(420, 310) rotate(-5)" opacity="0.4">
    <rect x="0" y="0" width="50" height="30" rx="3" fill="#1e2235" stroke="#6366f1" stroke-width="0.5" opacity="0.5"/>
    <rect x="5" y="5" width="20" height="3" rx="1" fill="#6366f1" opacity="0.4"/>
    <rect x="5" y="11" width="30" height="2" rx="1" fill="#2d3352"/>
  </g>

  <!-- Sparkle effects -->
  <circle cx="350" cy="100" r="2" fill="#00e89d" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="200" r="1.5" fill="#6366f1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="150" r="2" fill="#00e89d" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>