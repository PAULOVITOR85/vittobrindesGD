<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e89d"/>
      <stop offset="100%" stop-color="#00b374"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c988"/>
      <stop offset="100%" stop-color="#009966"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>

  <!-- Panfleto 1 (stack back) -->
  <g transform="translate(580,100) rotate(12)" filter="url(#sh)">
    <rect width="300" height="420" rx="4" fill="#f5f5f0"/>
    <rect y="0" width="300" height="60" fill="url(#g1)"/>
    <text x="150" y="38" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="bold" text-anchor="middle">SEU NEGÓCIO</text>
    <rect x="20" y="80" width="260" height="8" rx="4" fill="#ddd"/>
    <rect x="20" y="100" width="200" height="8" rx="4" fill="#eee"/>
    <rect x="20" y="120" width="240" height="8" rx="4" fill="#eee"/>
    <rect x="20" y="160" width="260" height="120" rx="4" fill="#e8e8e8"/>
    <rect x="20" y="300" width="120" height="8" rx="4" fill="#ddd"/>
    <rect x="20" y="320" width="180" height="8" rx="4" fill="#eee"/>
    <rect x="20" y="340" width="100" height="8" rx="4" fill="#eee"/>
    <rect x="20" y="370" width="260" height="30" rx="15" fill="url(#g2)"/>
    <text x="150" y="390" font-family="Arial,sans-serif" font-size="11" fill="white" font-weight="bold" text-anchor="middle">FAÇA SEU PEDIDO</text>
  </g>

  <!-- Panfleto 2 (front) -->
  <g transform="translate(100,60) rotate(-5)" filter="url(#sh)">
    <rect width="300" height="420" rx="4" fill="#fff"/>
    <rect y="0" width="300" height="60" fill="#1a1d25"/>
    <text x="150" y="38" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="bold" text-anchor="middle">PANFLETO</text>
    <rect x="20" y="80" width="260" height="140" rx="4" fill="#f0f0f0"/>
    <text x="150" y="160" font-family="Arial,sans-serif" font-size="12" fill="#999" text-anchor="middle">Imagem do Produto</text>
    <rect x="20" y="240" width="180" height="10" rx="5" fill="#333"/>
    <rect x="20" y="260" width="240" height="8" rx="4" fill="#ccc"/>
    <rect x="20" y="278" width="200" height="8" rx="4" fill="#ddd"/>
    <rect x="20" y="310" width="260" height="8" rx="4" fill="#eee"/>
    <rect x="20" y="328" width="220" height="8" rx="4" fill="#eee"/>
    <rect x="20" y="360" width="130" height="36" rx="18" fill="url(#g1)"/>
    <text x="85" y="383" font-family="Arial,sans-serif" font-size="11" fill="white" font-weight="bold" text-anchor="middle">SAIBA MAIS</text>
  </g>

  <!-- Panfleto 3 (small) -->
  <g transform="translate(480,240) rotate(6)" filter="url(#sh)">
    <rect width="200" height="280" rx="4" fill="#fafafa"/>
    <rect y="0" width="200" height="40" fill="url(#g2)"/>
    <text x="100" y="26" font-family="Arial,sans-serif" font-size="11" fill="white" font-weight="bold" text-anchor="middle">OFERTA</text>
    <rect x="14" y="54" width="172" height="80" rx="4" fill="#f0f0f0"/>
    <rect x="14" y="148" width="120" height="8" rx="4" fill="#ddd"/>
    <rect x="14" y="164" width="150" height="8" rx="4" fill="#eee"/>
    <rect x="14" y="190" width="172" height="6" rx="3" fill="#eee"/>
    <rect x="14" y="204" width="172" height="6" rx="3" fill="#eee"/>
    <rect x="14" y="230" width="172" height="28" rx="14" fill="#1a1d25"/>
    <text x="100" y="249" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold" text-anchor="middle">CONFIRA</text>
  </g>
</svg>
