<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e89d"/>
      <stop offset="100%" stop-color="#00b374"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c988"/>
      <stop offset="100%" stop-color="#009966"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>

  <!-- Banner roll (left) -->
  <g transform="translate(80,80)" filter="url(#sh)">
    <!-- Roll tube -->
    <ellipse cx="25" cy="200" rx="25" ry="180" fill="#e8e8e8"/>
    <ellipse cx="25" cy="200" rx="18" ry="180" fill="#f5f5f5"/>
    <ellipse cx="25" cy="200" rx="10" ry="180" fill="#ddd"/>
    <!-- Banner unrolled -->
    <rect x="50" y="20" width="280" height="360" rx="2" fill="#fff"/>
    <rect x="50" y="20" width="280" height="80" fill="url(#g1)"/>
    <text x="190" y="55" font-family="Arial,sans-serif" font-size="18" fill="white" font-weight="bold" text-anchor="middle">SEU ANÚNCIO</text>
    <text x="190" y="78" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Aqui fica sua mensagem</text>
    <rect x="70" y="120" width="240" height="120" rx="4" fill="#f0f0f0"/>
    <text x="190" y="185" font-family="Arial,sans-serif" font-size="11" fill="#bbb" text-anchor="middle">Imagem / Logo</text>
    <rect x="70" y="260" width="200" height="10" rx="5" fill="#333"/>
    <rect x="70" y="280" width="240" height="8" rx="4" fill="#ddd"/>
    <rect x="70" y="298" width="180" height="8" rx="4" fill="#eee"/>
    <rect x="70" y="330" width="160" height="32" rx="16" fill="url(#g2)"/>
    <text x="150" y="351" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold" text-anchor="middle">SAIBA MAIS</text>
  </g>

  <!-- Banner standing (right) -->
  <g transform="translate(500,60)" filter="url(#sh)">
    <!-- X-frame stand -->
    <line x1="160" y1="400" x2="200" y2="100" stroke="#555" stroke-width="4"/>
    <line x1="200" y1="400" x2="160" y2="100" stroke="#555" stroke-width="4"/>
    <line x1="150" y1="400" x2="210" y2="400" stroke="#555" stroke-width="4"/>
    <!-- Banner on stand -->
    <rect x="80" y="60" width="200" height="320" rx="2" fill="#1a1d25"/>
    <rect x="80" y="60" width="200" height="60" fill="url(#g1)"/>
    <text x="180" y="96" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="bold" text-anchor="middle">VITTO GD</text>
    <rect x="100" y="140" width="160" height="80" rx="4" fill="#2a2d36"/>
    <text x="180" y="185" font-family="Arial,sans-serif" font-size="10" fill="#666" text-anchor="middle">Gráfica Digital</text>
    <rect x="100" y="240" width="160" height="8" rx="4" fill="#333"/>
    <rect x="100" y="258" width="120" height="8" rx="4" fill="#3a3d46"/>
    <rect x="100" y="290" width="160" height="28" rx="14" fill="url(#g2)"/>
    <text x="180" y="309" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold" text-anchor="middle">PEDIR ORÇAMENTO</text>
  </g>

  <!-- Small banner roll (top) -->
  <g transform="translate(360,30) rotate(15)" filter="url(#sh)">
    <rect width="180" height="100" rx="2" fill="#fff"/>
    <rect width="180" height="30" fill="url(#g1)"/>
    <text x="90" y="20" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold" text-anchor="middle">BANNER</text>
    <rect x="12" y="40" width="156" height="40" rx="3" fill="#f0f0f0"/>
    <text x="90" y="65" font-family="Arial,sans-serif" font-size="8" fill="#bbb" text-anchor="middle">Lona 440g</text>
  </g>
</svg>
