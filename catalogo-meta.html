<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VITTO GD — Exportador Meta/WhatsApp</title>
<style>body{font-family:system-ui,sans-serif;background:#06070d;color:#f1f5f9;max-width:980px;margin:0 auto;padding:28px}h1{color:#00e89d}button{background:#00e89d;color:#04141c;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}select{padding:10px;border-radius:8px;border:1px solid #2b3040;background:#10121a;color:#fff}table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px}th,td{padding:9px;border-bottom:1px solid #22283a;text-align:left}small,p{color:#a3adc0}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ok{color:#00e89d}.tag{font-size:11px;color:#a5b4fc}</style>
</head><body>
<h1>Catálogo Meta / WhatsApp</h1>
<p>Gera o CSV usando o mesmo <code>produtos.js</code> do site. O modo recomendado seleciona exatamente 50 produtos comerciais, distribui a vitrine entre categorias e elimina títulos repetidos.</p>
<div class="bar"><label>Modo <select id="modo"><option value="whatsapp50">WhatsApp — 50 produtos principais</option><option value="principais">Consolidado — sem títulos repetidos</option><option value="todos">Todos os produtos</option></select></label><button onclick="baixar()">Baixar CSV</button></div>
<p id="res" class="ok"></p><div id="preview"></div>
<script src="produtos.js"></script><script>
const SITE='https://paulovitor85.github.io/vittobrindesGD/';
function clean(v){return String(v??'').replace(/\s+/g,' ').trim()}
function csv(v){v=clean(v);return '"'+v.replace(/"/g,'""')+'"'}
function desc(p){return clean([p.t,p.papel&&('Material: '+p.papel),p.tam&&('Tamanho: '+p.tam),p.cobertura&&('Acabamento: '+p.cobertura),p.prazo&&('Produção: '+p.prazo),'Personalização, medidas, quantidades e acabamentos disponíveis no catálogo online da VITTO GD.'].filter(Boolean).join(' | ')).slice(0,9999)}
function base(){return (window.PRODUTOS||[]).filter(p=>p.c&&p.t&&p.venda>0&&p.img&&!p.esgotado)}
function unicos(){const seen=new Set;return base().filter(p=>{const k=clean(p.cat).toLowerCase()+'|'+clean(p.t).toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}
function score(p){const s=(p.t+' '+(p.cat||'')+' '+(p.papel||'')).toLowerCase();let n=0;['adesivo','banner','lona','faixa','cartão','panfleto','folder','dtf','tecido','camisa','wind','placa','pvc','ps','tapete','capacho','sublim','lambe'].forEach((k,i)=>{if(s.includes(k))n+=30-i});if(p.venda>0)n+=5;if(p.img)n+=5;return n}
function whatsapp50(){const a=unicos();const grupos={};a.forEach(p=>(grupos[p.cat||'Outros']=grupos[p.cat||'Outros']||[]).push(p));Object.values(grupos).forEach(g=>g.sort((x,y)=>score(y)-score(x)||x.venda-y.venda));const cats=Object.keys(grupos).sort((x,y)=>grupos[y].length-grupos[x].length);const out=[];let rodada=0;while(out.length<50){let entrou=false;for(const c of cats){const p=grupos[c][rodada];if(p&&out.length<50){out.push(p);entrou=true}}if(!entrou)break;rodada++}if(out.length<50){a.sort((x,y)=>score(y)-score(x));for(const p of a){if(out.length>=50)break;if(!out.includes(p))out.push(p)}}return out.slice(0,50)}
function itens(){const m=document.getElementById('modo').value;if(m==='todos')return base();if(m==='principais')return unicos();return whatsapp50()}
function rows(){return itens().map(p=>({id:p.c,title:p.t,description:desc(p),availability:'in stock',condition:'new',price:Number(p.venda).toFixed(2)+' BRL',link:SITE+'?produto='+encodeURIComponent(p.c),image_link:p.img,brand:'VITTO GD',product_type:p.cat||'Gráfica Digital'}))}
const cols=['id','title','description','availability','condition','price','link','image_link','brand','product_type'];
function baixar(){const r=rows(),txt='\ufeff'+cols.join(',')+'\r\n'+r.map(x=>cols.map(c=>csv(x[c])).join(',')).join('\r\n');const b=new Blob([txt],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=document.getElementById('modo').value==='whatsapp50'?'catalogo-vitto-whatsapp-50.csv':'catalogo-vitto-meta.csv';a.click();URL.revokeObjectURL(a.href);preview(r,' itens exportados.')}
function preview(r=rows(),msg=' itens prontos para exportação.'){const counts={};r.forEach(p=>counts[p.product_type]=(counts[p.product_type]||0)+1);document.getElementById('res').textContent=r.length+msg+' Categorias: '+Object.entries(counts).map(([k,v])=>k+' ('+v+')').join(' · ');document.getElementById('preview').innerHTML='<table><thead><tr><th>#</th><th>Produto</th><th>Categoria</th><th>Preço</th></tr></thead><tbody>'+r.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+clean(p.title)+'</td><td><span class="tag">'+clean(p.product_type)+'</span></td><td>'+p.price+'</td></tr>').join('')+'</tbody></table>'}
document.getElementById('modo').onchange=()=>preview();preview();
</script></body></html>
